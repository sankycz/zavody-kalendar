# Nativní iOS / iPadOS appka Závody aut (SwiftUI). Xcode projekt se z tohoto souboru
# generuje příkazem `xcodegen` (brew install xcodegen), ZavodyAut.xcodeproj se necommituje.
name: ZavodyAut
options:
  bundleIdPrefix: cz.zavodyaut
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: Z7H5MA4BBC
packages:
  # Vektorová mapa s OpenFreeMap dlaždicemi (jako web) a offline balíčky dlaždic.
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: "6.0.0"
targets:
  ZavodyAut:
    type: application
    platform: iOS
    sources:
      - path: ZavodyAut
    dependencies:
      - package: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.zavodyaut.app
        PRODUCT_NAME: ZavodyAut
        INFOPLIST_FILE: Info.plist
        # iPhone + iPad; na Macu s Apple Silicon jako „Designed for iPad“.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACOS_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
