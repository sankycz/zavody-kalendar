<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Kalendář automobilových závodů v Česku – rally, vrchy, autokros, slalom, okruhy." />
    <meta name="theme-color" content="#eef0f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#06070b" media="(prefers-color-scheme: dark)" />
    <title>Závody aut v ČR</title>
    <!-- No SVG favicon: iOS takes it as the largest icon for the Home Screen, cannot draw it there
         and puts a letter instead of the logo. PNG/ICO only. -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <!-- ?v: iOS keeps a home-screen icon per URL; bump it when the logo changes. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Link preview (Facebook, WhatsApp, Messenger, X): the app, not a single race. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Závody aut v ČR" />
    <meta property="og:title" content="Závody aut v ČR" />
    <meta property="og:description" content="Kalendář automobilových závodů v Česku – rally, vrchy, autokros, slalom, okruhy." />
    <meta property="og:url" content="https://www.zavody-aut.cz/" />
    <meta property="og:image" content="https://www.zavody-aut.cz/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Závody aut v ČR – kalendář automobilových závodů v Česku" />
    <meta property="og:locale" content="cs_CZ" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-title" content="Závody aut" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("theme");
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "4bb7fd96775949ce89d79c7ae7de00e7"}'></script><!-- End Cloudflare Web Analytics -->
  </body>
</html>
